<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Geoclean</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
    <style> body { font-family: "Inter", sans-serif; } </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-lg bg-white p-6 rounded-xl shadow-lg">
        <div id="messageBox" class="hidden mb-4 p-3 rounded-lg text-center font-semibold"></div>

        <h1 class="text-3xl font-bold text-gray-800 mb-2">🌍 Geoclean</h1>
        <p class="text-sm text-gray-500 mb-6">Upload cleanup images, details, and GPS location.</p>

        <div class="mb-4">
            <label for="userName" class="block text-sm font-medium mb-1">Your Name</label>
            <input id="userName" type="text" placeholder="Your Name" class="w-full px-3 py-2 border rounded-lg focus:ring-blue-500" />
        </div>

        <div class="mb-4">
            <label for="userEmail" class="block text-sm font-medium mb-1">Your Email</label>
            <input id="userEmail" type="email" placeholder="Your Email" class="w-full px-3 py-2 border rounded-lg focus:ring-blue-500" />
        </div>

        <div class="mb-4">
            <label for="eventDate" class="block text-sm font-medium mb-1">Date of Event</label>
            <input id="eventDate" type="date" class="w-full px-3 py-2 border rounded-lg focus:ring-blue-500" />
        </div>

        <div class="mb-4">
            <label for="userCaption" class="block text-sm font-medium mb-1">Caption</label>
            <textarea id="userCaption" placeholder="Brief description" class="w-full px-3 py-2 border rounded-lg h-20 resize-y focus:ring-blue-500"></textarea>
        </div>

        <div class="mb-4">
            <label for="file-input" class="block text-sm font-medium mb-1">Upload Photos</label>
            <input id="file-input" type="file" accept="image/*" multiple capture="environment" class="w-full text-sm text-gray-500 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer" />
        </div>

        <p id="location" class="text-sm text-gray-600 mt-5 p-3 bg-gray-50 rounded-lg border">📍 Location not retrieved yet.</p>

        <button id="submitBtn" class="w-full bg-green-500 text-white font-bold py-3 rounded-lg hover:bg-green-600 mt-5 transition">Submit</button>
        <button id="getInBtn" class="w-full bg-blue-500 text-white font-bold py-3 rounded-lg hover:bg-blue-600 mt-2 transition">View Feed</button>
        <button onclick="window.location.href='manage.html'" class="w-full bg-gray-800 text-white font-bold py-3 rounded-lg hover:bg-gray-900 mt-2 transition">🔐 Login</button>

        <div id="grid" class="grid grid-cols-2 gap-3 mt-6"></div>
    </div>

    <script>
        const [locOut, msgBox, submitBtn, dateIn, fileIn, grid] = ["location", "messageBox", "submitBtn", "eventDate", "file-input", "grid"].map(id => document.getElementById(id));
        dateIn.valueAsDate = new Date();

        let [cLat, cLon, cTown, cArea, cState] = [null, null, null, null, null];

        const showMsg = (msg, type) => {
            msgBox.textContent = msg;
            msgBox.className = `mb-4 p-3 rounded-lg text-center font-semibold ${type === "error" ? "bg-red-100 text-red-700" : type === "success" ? "bg-green-100 text-green-700" : "bg-blue-100 text-blue-700"}`;
            msgBox.classList.remove("hidden");
            setTimeout(() => { msgBox.classList.add("hidden"); }, 5000);
        };

        const getLoc = () => {
            if (!navigator.geolocation) { showMsg("❌ Geolocation not supported.", "error"); return; }
            showMsg("Retrieving location...", "info");
            navigator.geolocation.getCurrentPosition(async (position) => {
                const [lat, lon] = [position.coords.latitude.toFixed(6), position.coords.longitude.toFixed(6)];
                try {
                    const data = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`).then(res => res.json());
                    [cTown, cArea, cState, cLat, cLon] = [
                        data.address.city || data.address.town || data.address.village || "Unknown place",
                        data.address.suburb || data.address.neighbourhood || "Unknown area",
                        data.address.state || "Unknown state", lat, lon
                    ];
                    // Corrected map link logic
                    locOut.innerHTML = `
                        <div class="text-left">📍 Located: <strong>${cTown}</strong> (${cState})<br>
                        🌍 Coords: ${lat}, ${lon} <a href="https://www.google.com/maps/search/?api=1&query=${lat},${lon}" target="_blank" class="text-blue-500 font-semibold ml-2">Map</a></div>`;
                    showMsg("Location retrieved.", "success");
                } catch (err) {
                    locOut.textContent = "⚠️ Failed to fetch place name.";
                    showMsg("⚠️ Failed to fetch place name.", "error");
                }
            }, (error) => {
                locOut.textContent = "⚠️ Unable to retrieve location: " + error.message;
                showMsg("⚠️ Unable to retrieve location.", "error");
            });
        };
        getLoc();

        fileIn.addEventListener("change", () => {
            grid.innerHTML = "";
            [...fileIn.files].forEach(file => {
                const [card, img, caption] = [document.createElement("div"), document.createElement("img"), document.createElement("p")];
                card.className = "flex flex-col items-center bg-gray-50 rounded-lg shadow-sm";
                img.className = "w-full h-20 object-cover rounded-t-lg"; img.src = URL.createObjectURL(file);
                caption.className = "text-xs p-1 text-gray-600 text-center truncate w-full"; caption.textContent = file.name;
                card.append(img, caption); grid.appendChild(card);
            });
        });

        submitBtn.addEventListener("click", async () => {
            const [files, name, email, caption, eventDate] = [fileIn.files, userName.value.trim(), userEmail.value.trim(), userCaption.value.trim(), dateIn.value];
            if (!name || !email || !caption || !eventDate || files.length === 0 || !cTown) {
                showMsg(`⚠️ Fill all fields, upload photos, and enable location.`, "error"); return;
            }

            const formData = new FormData();
            for (let file of files) formData.append("photos", file);
            formData.append("name", name); formData.append("email", email); formData.append("caption", caption);
            formData.append("event_date", eventDate);
            formData.append("town", cTown); formData.append("area", cArea); formData.append("state", cState);
            formData.append("lat", cLat); formData.append("lon", cLon);

            try {
                submitBtn.disabled = true; showMsg("Uploading...", "info");
                const res = await fetch("http://127.0.0.1:5000/upload", { method: "POST", body: formData }).then(r => r.json());
                if (res.message && res.message.includes("successful")) {
                    showMsg("✅ Submitted and saved!", "success");
                    [userName.value, userEmail.value, userCaption.value, fileIn.value, grid.innerHTML] = ["", "", "", "", ""];
                    dateIn.valueAsDate = new Date();
                } else {
                    showMsg(`❌ Upload failed: ${res.error || "Unknown error"}`, "error");
                }
            } catch (err) {
                showMsg("❌ Upload failed. Check backend connection.", "error");
            } finally {
                submitBtn.disabled = false;
            }
        });

        document.getElementById("getInBtn").addEventListener("click", () => { window.location.href = "feed.html"; });
    </script>
</body>
</html>
